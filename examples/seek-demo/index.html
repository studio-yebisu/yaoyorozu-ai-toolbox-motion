<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>時刻指定の見本｜Claude モーション制作ガイド</title><link rel="stylesheet" href="../../assets/site.css"><style>.example-main{max-width:770px;padding-block:35px 70px}.example-main h1{font-size:28px;line-height:1.5}.example-main>p{font-size:13px;color:var(--muted)}.example-stage{margin:28px 0 15px;aspect-ratio:16/9;background:#1c2329;color:#f2eee6;border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.example-stage>span{position:absolute;left:25px;top:19px;font:10px Consolas,monospace;letter-spacing:2px;color:#aab6a0}.example-stage h2{font-size:clamp(28px,8vw,64px);line-height:1;margin:0;letter-spacing:-.04em}.example-stage p{font:12px Consolas,monospace;letter-spacing:2px;color:#cbe681;margin-top:17px}.example-stage .orbit-dot{position:absolute;width:37px;height:37px;border-radius:50%;background:#cbe681;left:50%;top:50%}.example-controls{display:flex;align-items:center;gap:12px}.example-controls input{flex:1;min-width:0;accent-color:#73885b}.example-controls button{font-size:12px;padding:5px 13px;border:1px solid #bdc6b3;border-radius:5px;background:transparent}.example-controls output{font:12px Consolas,monospace;width:46px}.example-note{font-size:11px!important;margin-top:20px}</style></head><body><main class="page-width example-main"><a href="../../guide.html#workflow" class="back-link">← スタックの組み方へ</a><p class="eyebrow">ORIGINAL SEEKABLE EXAMPLE</p><h1>同じ時刻へ、同じ画面へ。</h1><p>スライダーで途中の時刻へ移動できます。動きの状態は、毎回その時刻から計算します。</p><div class="example-stage" aria-label="MOTIONという文字と、時刻に合わせて円運動する点の独自見本"><span>FRAME = TIME × FPS</span><h2 id="example-title">MOTION.</h2><p id="example-subtitle">MAKE EVERY FRAME COUNT.</p><i class="orbit-dot" id="orbit-dot" aria-hidden="true"></i></div><div class="example-controls"><button id="play" type="button" aria-pressed="false">再生 ▶</button><label class="scrub-label" for="seek-time">時刻</label><input id="seek-time" type="range" min="0" max="6" step="0.01" value="1.8" aria-label="見本の時刻"><output id="seek-output" for="seek-time">1.80s</output></div><p class="example-note">このHTML・動きは本ガイド独自の見本です。外部ライブラリやモデルAPIを使わず、時刻指定の考え方を示しています。<a href="https://github.com/studio-yebisu/yaoyorozu-ai-toolbox-motion/tree/main/examples/seek-demo">ソースを見る ↗</a></p></main><script src="scene.js"></script></body></html>
